<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1729"><title>Weather Dashboard V3</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:#0e1729;color:#fff}.wrap{max-width:540px;margin:auto;padding:20px 16px 38px}.eyebrow{font-size:12px;letter-spacing:2px;color:#adc2d9;font-weight:700}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}h1{font-size:29px;margin:0}select,button{font:inherit;color:white;border:0;border-radius:10px;background:#318ee5;padding:12px;cursor:pointer}select{max-width:45%;background:#243a59}.hero{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:14px 0 5px}.temp{font-size:62px;font-weight:650;letter-spacing:-3px}.desc{font-size:16px;text-align:right}.updated{color:#adc2d9;font-size:12px;margin:0 0 16px}.card{background:#1c2b45;border-radius:14px;padding:16px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:22px}.muted{color:#adc2d9;font-size:12px}.value{font-size:22px;margin-top:5px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}.tabs button{background:#1c2b45;padding:12px 2px;font-size:13px}.tabs button.active{background:#318ee5}.section{font-size:13px;color:#adc2d9;letter-spacing:1px;margin:14px 4px 8px}.forecast{min-height:184px}.line{padding:7px 0;font-size:14px;border-bottom:1px solid #30405a}.line:last-child{border-bottom:0}.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:13px}.foot small{color:#adc2d9}.notice{font-size:12px;color:#f6ac45;min-height:24px;margin-top:8px}button:disabled{opacity:.6}a{color:#adc2d9;font-size:11px}#error{color:#ffb4a8;white-space:pre-wrap;font-size:12px;margin-top:8px}
</style></head><body><main class="wrap"><div class="eyebrow">WEATHER DASHBOARD V3.0</div><header><h1 id="cityName">Thaxted</h1><select id="city" aria-label="Select city"><option value="0">Thaxted</option><option value="1">New Delhi</option><option value="2">Shimla</option><option value="3">Edinburgh</option><option value="4">New York</option><option value="5">London</option><option value="6">Standon</option><option value="7">Aldringham</option></select></header><div class="hero"><div class="temp" id="temp">--°C</div><div class="desc" id="desc">Ready to update</div></div><p class="updated" id="updated">Tap Refresh to load live weather</p><div class="card metrics"><div><div class="muted">Feels like</div><div class="value" id="feels">--</div></div><div><div class="muted">Humidity</div><div class="value" id="humidity">--</div></div><div><div class="muted">Wind</div><div class="value" id="wind">--</div></div><div><div class="muted">High / Low</div><div class="value" id="highlow">--</div></div></div><nav class="tabs" aria-label="Weather pages"><button class="active" data-page="0">Today</button><button data-page="1">Hourly</button><button data-page="2">5 Days</button><button data-page="3">Air</button></nav><div class="section" id="section">TODAY / SUN</div><div class="card forecast" id="forecast"><div class="line">Waiting for weather data...</div></div><div class="notice" id="notice"></div><div class="foot"><small id="status">Local app · Open-Meteo data</small><button id="refresh">Refresh</button></div><div id="error" role="alert"></div><p><a href="https://open-meteo.com/" target="_blank" rel="noopener">Weather data: Open-Meteo</a></p></main><script>
'use strict'
const cities=[['Thaxted',51.9539,0.3437],['New Delhi',28.6139,77.209],['Shimla',31.1048,77.1734],['Edinburgh',55.9533,-3.1883],['New York',40.7128,-74.006],['London',51.5072,-0.1276],['Standon',51.8808,0.0270],['Aldringham',52.1939,1.5786]];
const descriptions={0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Icy fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Heavy snow',95:'Thunderstorm',96:'Storm and hail',99:'Storm and hail'};
const $=id=>document.getElementById(id);let cityIndex=0,page=0,latest=null,loading=false,requestId=0;
function number(v,unit='',digits=0){return v==null?'--':Number(v).toFixed(digits)+unit}
function line(s){let d=document.createElement('div');d.className='line';d.textContent=s;return d}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',+b.dataset.page===page));$('section').textContent=['TODAY / SUN','NEXT 5 HOURS','5-DAY FORECAST','AIR QUALITY'][page];let rows=['Waiting for weather data...'];if(latest){const {weather:w,air:a}=latest,d=w.daily;if(page===0){rows=['Sunrise: '+d.sunrise[0].slice(-5),'Sunset: '+d.sunset[0].slice(-5),'Today: '+(descriptions[d.weather_code[0]]||'Variable'),'Rain chance: see Hourly tab','Forecast times are local to city']}else if(page===1){let h=w.hourly,now=w.current.time.slice(0,13),start=h.time.findIndex(t=>t.slice(0,13)>=now);if(start<0)start=0;rows=h.time.slice(start,start+5).map((t,j)=>`${t.slice(-5)}    ${number(h.temperature_2m[start+j],'°')}    Rain ${number(h.precipitation_probability[start+j],'%')}`)}else if(page===2){rows=d.time.slice(0,5).map((date,i)=>`${new Date(date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'2-digit'})}    ${number(d.temperature_2m_max[i],'°')} / ${number(d.temperature_2m_min[i],'°')}    ${descriptions[d.weather_code[i]]||'Variable'}`)}else{let c=a?.current||{},aqi=c.european_aqi;if(aqi==null){rows=['Air quality temporarily unavailable']}else{let band=aqi<=20?'Good':aqi<=40?'Fair':aqi<=60?'Moderate':aqi<=80?'Poor':aqi<=100?'Very poor':'Extremely poor';rows=['European AQI: '+number(aqi),'Category: '+band,'PM2.5: '+number(c.pm2_5,' µg/m³',1),'PM10: '+number(c.pm10,' µg/m³',1),'Air values are model estimates']}}}const box=$('forecast');box.replaceChildren(...rows.map(line))}
async function getJSON(url){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{let res=await fetch(url,{signal:controller.signal,cache:'no-store'});if(!res.ok)throw Error('Weather service returned HTTP '+res.status);return await res.json()}finally{clearTimeout(timeout)}}
async function refresh(){if(loading)return;loading=true;const id=++requestId,chosen=cityIndex; $('refresh').disabled=true;$('status').textContent='Updating...';$('error').textContent='';try{const [name,lat,lon]=cities[chosen],base={latitude:lat,longitude:lon,timezone:'auto'},url=(host,params)=>host+'?'+new URLSearchParams({...base,...params});const weather=await getJSON(url('https://api.open-meteo.com/v1/forecast',{current:'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m',hourly:'temperature_2m,precipitation_probability,weather_code',daily:'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset',forecast_days:5}));let air={};try{air=await getJSON(url('https://air-quality-api.open-meteo.com/v1/air-quality',{current:'european_aqi,pm2_5,pm10',forecast_days:1}))}catch(e){console.warn('Air quality unavailable:',e)}if(id!==requestId||chosen!==cityIndex)return;latest={weather,air};const c=weather.current,d=weather.daily;$('temp').textContent=number(c.temperature_2m,'°C');$('desc').textContent=descriptions[c.weather_code]||'Unknown';$('updated').textContent='Updated '+c.time.replace('T',' ')+' (local)';$('feels').textContent=number(c.apparent_temperature,'°C');$('humidity').textContent=number(c.relative_humidity_2m,'%');$('wind').textContent=number(c.wind_speed_10m,' km/h');$('highlow').textContent=number(d.temperature_2m_max[0],'°')+' / '+number(d.temperature_2m_min[0],'°');$('notice').textContent=[95,96,99].includes(c.weather_code)?'Advisory: thunderstorms possible':c.wind_speed_10m>=50?'Advisory: strong winds reported':c.temperature_2m>=35?'Advisory: high temperature':c.temperature_2m<=0?'Advisory: freezing temperatures':'No threshold-based advisories';$('status').textContent='Updated successfully';render()}catch(e){$('status').textContent='Update failed';$('error').textContent='Unable to retrieve weather: '+e.message+'\nIf opened directly from Files, iPadOS may restrict network requests from local HTML. Try opening in Safari or a local HTML viewer.'}finally{loading=false;$('refresh').disabled=false}}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=+b.dataset.page;render()}));$('refresh').addEventListener('click',refresh);$('city').addEventListener('change',e=>{cityIndex=+e.target.value;$('cityName').textContent=cities[cityIndex][0];latest=null;$('temp').textContent='--°C';$('desc').textContent='Loading...';render();if(!loading)refresh();else $('status').textContent='Tap Refresh for selected city'});render();refresh();
</script></body></html>
